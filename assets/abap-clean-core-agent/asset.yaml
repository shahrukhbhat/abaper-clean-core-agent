apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: abap-clean-core-agent
  version: 1.0.0
  description: >
    ABAP Clean Core compliance analyzer agent - classifies ABAP objects against
    Clean Core Levels A-D, delivers extensibility verdicts, and generates
    remediation guidance at selectable depth levels.

type: agent

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: abap-clean-core-agent
      kind: a2a
      ordId: customer.build:apiResource:abap-clean-core-7d7c2.abap-clean-core-agent:v1

requires:
  - name: ai-abaper-mcp
    kind: mcp-server
    ordId: ai-abaper-mcp

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
